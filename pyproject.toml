[project]
name = "toulligqc"
dynamic = ["version"]
description = "A post sequencing QC tool for Oxford Nanopore sequencers"
readme = "README.md"
requires-python = ">=3.11.0"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Genomic Paris Centre team", email = "toulligqc@bio.ens.psl.eu" }
]
keywords = ["Nanopore", "MinION", "QC", "report"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: POSIX",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "License :: OSI Approved :: CEA CNRS Inria Logiciel Libre License, version 2.1 (CeCILL-2.1)",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "matplotlib>=3.10.7",
    "plotly>=5.20.0,<6.0.0",
    "h5py>=3.15.1",
    "pandas>=2.3.3,<3.0.0",
    "numpy>=2.3.5",
    "scipy>=1.16.3",
    "scikit-learn>=1.7.2",
    "tqdm>=4.67.3",
    "pysam>=0.23.3",
    "pod5>=0.3.10",
    "ezcharts>=0.15.2",
    "packaging>=26.0",
]

[project.urls]
Homepage = "https://github.com/GenomiqueENS/toulligQC"
Repository = "https://github.com/GenomiqueENS/toulligQC"
Issues = "https://github.com/GenomiqueENS/toulligQC/issues"

[project.scripts]
toulligqc = "toulligqc.toulligqc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "toulligqc/version.py"

[tool.hatch.build.targets.wheel]
packages = ["toulligqc"]

[tool.hatch.build.targets.sdist]
include = [
    "/toulligqc",
    "/README.md",
    "/LICENSE.txt",
    "/LICENSE-CeCILL.txt",
    "/AUTHORS",
    "/CHANGES.md",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pytest>=8",
]
# Extras for running the API example notebook (example_api.ipynb).
# Plotly needs nbformat to render figures inline in Jupyter.
notebook = [
    "nbformat>=4.2.0",
    "ipykernel",
]
# Extras for building the documentation site (mkdocs build / serve).
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-jupyter>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".github",
    "__pycache__",
    "dist",
    "build",
    "docs",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["toulligqc"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
